[project]
name = "workforce-budget-planner"
version = "0.1.0"
description = "Headcount and operating-budget forecasting for a multi-site semiconductor manufacturing org"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy==2.0.36",
    "numpy==2.0.2",
    "pandas==2.2.3",
    "psycopg2-binary==2.9.10",
    "python-dotenv==1.0.1",
    "statsmodels==0.14.4",
    "PyYAML==6.0.2",
    "pyarrow==18.1.0",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "pytest-cov==6.0.0", "ruff==0.8.4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/wbp"]
omit = ["src/wbp/__init__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = ["if __name__ == \"__main__\":"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
