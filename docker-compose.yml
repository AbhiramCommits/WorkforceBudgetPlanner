services:
  db:
    image: postgres:15
    container_name: workforce-budget-planner-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: wbp
      POSTGRES_PASSWORD: wbp_password
      POSTGRES_DB: workforce_budget
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wbp -d workforce_budget"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  pgdata:
