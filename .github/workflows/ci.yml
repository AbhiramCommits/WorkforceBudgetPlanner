name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: wbp
          POSTGRES_PASSWORD: wbp_password
          POSTGRES_DB: workforce_budget
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wbp -d workforce_budget"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg2://wbp:wbp_password@localhost:5432/workforce_budget
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check src tests

      - name: Create schema and seed data
        run: PYTHONPATH=src python -m wbp.generate_data

      - name: Data quality checks
        run: PYTHONPATH=src python -m wbp.quality

      - name: Run tests with coverage
        run: PYTHONPATH=src python -m pytest --cov=src/wbp --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
